<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Cookie Shooter</h1>
  <p id="msg">Loading...</p>
  <div id="diff" role="radiogroup" aria-label="Difficulty">
    <label><input type="radio" name="diff" value="easy"><span title="Up to 5 enemies">Easy</span></label>
    <label><input type="radio" name="diff" value="medium" checked><span title="Up to 10 enemies">Medium</span></label>
    <label><input type="radio" name="diff" value="hard"><span title="Up to 20 enemies">Hard</span></label>
  </div>
  <div class="btns">
    <button id="start" class="primary" title="The page's own elements attack you">Start attack</button>
    <button id="next" hidden>Next wave</button>
    <button id="end" hidden>End attack</button>
  </div>
  <details id="conq">
    <summary>Sites conquered: <b id="ccount">0</b></summary>
    <ul id="clist"></ul>
    <button id="cclear" class="link">Clear list</button>
  </details>
  <button id="cookies" class="link" title="The original endless cookie waves">Play cookie waves instead</button>
  <label><input type="checkbox" id="sound" checked> Sound</label>
  <p class="help">WASD move, mouse aim, click attack, 1-3 weapons, Esc pause.</p>
  <script src="popup.js"></script>
</body>
</html>
