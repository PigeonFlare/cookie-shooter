<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Cookie Shooter</h1>
  <p id="msg">Loading...</p>
  <div class="btns">
    <button id="start" class="primary" title="Cookies attack in waves">Start attack</button>
    <button id="page" title="The page's own elements attack you">Page attack</button>
    <button id="next" hidden>Next wave</button>
    <button id="end" hidden>End attack</button>
    <span id="best"></span>
  </div>
  <label><input type="checkbox" id="sound" checked> Sound</label>
  <p class="help">WASD move, mouse aim, click attack, 1-3 weapons, Esc pause.</p>
  <script src="popup.js"></script>
</body>
</html>
